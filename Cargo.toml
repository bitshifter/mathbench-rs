[package]
name = "mathbench"
version = "0.5.0"
edition = "2024"

[features]
# defaults can be disabled for benchmarks but are required for tests
default = ["cgmath", "nalgebra", "ultraviolet"]

# fake glam target for wide comparisons
glam_f32x1 = []

# glam_fearless wide types: one type, width chosen at runtime by fearless_simd dispatch
glam_fearless = ["dep:glam_fearless", "dep:fearless_simd"]

ultraviolet_f32x4 = ["ultraviolet", "wide_mathbench", "dep:wide_v07"]
ultraviolet_f32x8 = ["ultraviolet", "wide_mathbench", "dep:wide_v07"]
ultraviolet_wide = ["ultraviolet_f32x4", "ultraviolet_f32x8"]

# nalgebra wide types use simba's stable `wide`-backed types (WideF32x4,
# WideF32x8, WideF64x4), so these build on stable
nalgebra_f32x4 = ["nalgebra", "simba"]
nalgebra_f32x8 = ["nalgebra", "simba"]
nalgebra_wide = ["nalgebra_f32x4", "nalgebra_f32x8"]

scalar = ["cgmath", "nalgebra", "ultraviolet", "euclid", "vek", "pathfinder_geometry"]

wide = ["glam_f32x1", "ultraviolet_wide", "nalgebra_wide", "glam_fearless"]

all = ["scalar", "wide"]

[dependencies]
mint = "0.5.9"
rand = "0.10.3"
rand_pcg = "0.10.2"

[dependencies.glam]
version = "0.34.1"
default-features = false
features = ["std", "mint-05", "rand-010"]
# a lot of random data generation uses glam, so can't be optional yet
# optional = true

[dependencies.nalgebra]
version = "0.35.0"
default-features = false
features = ["std", "mint"]
optional = true

[dependencies.simba]
version = "0.10.2"
optional = true

[dependencies.cgmath]
version = "0.18.0"
features = ["mint"]
optional = true

[dependencies.euclid]
version = "0.22.14"
optional = true

[dependencies.vek]
version = "0.17.2"
default-features = false
features = ["std", "mint"]
optional = true

[dependencies.pathfinder_geometry]
version = "0.5.1"
optional = true


[dependencies.ultraviolet]
version = "0.10.0"
features = ["mint"]
optional = true

[dependencies.wide_mathbench]
package = "wide"
version = "1.7.1"
optional = true

[dependencies.wide_v07]
package = "wide"
version = "0.7"
optional = true

# Prototype crate on the `glam-fearless` branch of pathtrace-rs.
[dependencies.glam_fearless]
package = "glam-fearless"
git = "https://github.com/bitshifter/pathtrace-rs"
rev = "a8a788cef03ef2f8ec064233b6342470fd7345a7"
optional = true

# `#[simd]` expands to paths in `fearless_simd`, so it must be a direct dependency.
[dependencies.fearless_simd]
version = "1.1"
optional = true

[dev-dependencies]
criterion = "0.8.2"

# [patch.crates-io]
# glam = { path = "../glam-rs" }

[lib]
bench = false

[[bench]]
name = "eulerbench"
harness = false

[[bench]]
name = "ray_sphere_intersect"
harness = false

[[bench]]
name = "rotation3"
harness = false

[[bench]]
name = "matrix2"
harness = false

[[bench]]
name = "matrix3"
harness = false

[[bench]]
name = "matrix4"
harness = false

[[bench]]
name = "transform2d"
harness = false

[[bench]]
name = "transform3d"
harness = false

[[bench]]
name = "transformations"
harness = false

[[bench]]
name = "vector3"
harness = false

[profile.bench]
# codegen-units = 1
# lto = true

[workspace]
members = ["tools/summarize", "tools/buildbench"]
